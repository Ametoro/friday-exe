<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>金曜日.EXE</title><style>
*{box-sizing:border-box}body{margin:0;background:#050805;color:#00ff41;font-family:Consolas,'Courier New',monospace} [hidden]{display:none!important}#standby{max-width:850px;margin:auto;padding:32px 24px;min-height:100svh;display:flex;flex-direction:column}header,footer{font-size:13px;border-bottom:1px solid #174421;padding:12px 0}footer{border:0;border-top:1px solid #174421;color:#168c38;margin-top:auto}#logs{line-height:1.9;font-size:14px}.center{text-align:center;margin:auto 0;padding:45px 0}h1{font-size:clamp(24px,5vw,42px)}#count{font-size:clamp(28px,7vw,64px);font-variant-numeric:tabular-nums}#track{height:8px;background:#12301a;margin:24px auto;max-width:500px}#bar{height:100%;background:#00ff41}#standby:after{content:'';position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(transparent 0 3px,#0003 3px 4px)}#party{position:fixed;inset:0;overflow:hidden;background:linear-gradient(125deg,#a33994,#24a6a1,#e3b346,#4568bd);background-size:300% 300%;animation:bg 12s ease infinite;color:white} @keyframes bg{50%{background-position:100% 100%}}#cat{position:absolute;left:50%;top:50%;width:min(78vw,680px);transform:translate(-50%,-50%);opacity:.8;perspective:900px}#cat img{width:100%;animation:cat 3s linear infinite;filter:drop-shadow(0 20px 20px #0005)}@keyframes cat{to{transform:rotateY(360deg)}}#rain,#confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden}.can{position:absolute;top:-240px;width:var(--w);animation:fall var(--t) linear infinite;animation-delay:var(--delay);left:var(--x)}@keyframes fall{to{transform:translateY(calc(100vh + 300px)) rotate(720deg)}}#front{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:42px;text-align:center;pointer-events:none}#logo{width:max-content;font-size:clamp(32px,10vw,100px);font-weight:1000;animation:spin 4s linear infinite;text-shadow:4px 4px #e21b57,-4px -4px #2144bd,0 0 15px #000;letter-spacing:-.05em}@keyframes spin{to{transform:rotate(360deg)}}#boom{pointer-events:auto;background:#c91626;color:white;border:4px solid #ff9a9a;border-radius:12px;padding:20px 48px;font:bold 25px monospace;box-shadow:0 8px #650a19;cursor:pointer}#boom:active{transform:translateY(6px);box-shadow:0 2px #650a19}#message{font-size:clamp(20px,6vw,58px);font-weight:bold;text-shadow:2px 2px #000;min-height:1.4em}#party.boost #logo{animation-duration:1s;font-size:clamp(40px,12vw,130px)}.conf{position:absolute;left:50%;top:50%;width:9px;height:14px;background:var(--color);animation:burst 2s ease-out forwards}@keyframes burst{to{transform:translate(var(--dx),var(--dy)) rotate(720deg);opacity:0}}#test{position:fixed;bottom:12px;right:12px;z-index:10;background:#111;color:#ddd;border:1px solid #888;padding:8px;cursor:pointer} @media(prefers-reduced-motion:reduce){#cat img,#logo,#party{animation:none!important}.can{animation-duration:20s!important}.conf{animation:none;display:none}}
#psy{position:absolute;inset:-100%;background:repeating-conic-gradient(#ff00a8 0deg 15deg,#290057 15deg 30deg,#00d9a0 30deg 45deg,#ffe500 45deg 60deg);animation:spin 28s linear infinite;opacity:.8}#tiles{position:absolute;inset:0;width:100%;height:100%;filter:drop-shadow(3px 2px #e500ff) drop-shadow(-3px -2px cyan)}#logo{color:#ffff00;text-shadow:5px 5px #ff0080,-5px -5px cyan,8px 8px black}#party.boost #psy{animation-duration:12s}#party.paused *{animation-play-state:paused!important}#mute,#motion{background:#111;color:white;border:1px solid white;padding:8px;cursor:pointer}#front{gap:22px}@media(prefers-reduced-motion:reduce){#psy{animation:none!important}}</style></head><body><main id="standby"><header>金曜日.EXE v2.5.0　 // SYSTEM ONLINE</header><p id="logs">&gt; システムを起動しています...<br>&gt; 日本標準時を取得しました。<br>&gt; 金曜日を検出できませんでした。<br>&gt; 待機モードに移行します。</p><div class="center"><h1>金曜日ではありません。</h1><p id="day"></p><p>金曜日.EXE 起動まで</p><div id="count" role="timer"></div><div id="track"><div id="bar"></div></div><p>STATUS: STANDBY <span>_</span></p></div><footer>© 2026 FRIDAY SYSTEMS. All Fridays Reserved.</footer></main><main id="party" hidden><div id="psy"></div><canvas id="tiles"></canvas><video id="oiia" src="oiia.webm" muted loop playsinline hidden></video><audio id="sound" src="bgm.mp3" loop></audio><audio id="effect" src="oiia.mp3" preload="auto"></audio><div id="rain"></div><div id="confetti"></div><div id="front"><div>FRIDAY MODE ACTIVATED</div><div id="logo">金曜日.EXE</div><button id="boom">金曜日を加速する</button><button id="mute" style="pointer-events:auto">音声停止</button><button id="motion" style="pointer-events:auto">演出停止</button><div id="message">STATUS: FRIDAY</div></div></main><button id="test">金曜日モードを試す</button><script>
const $=id=>document.getElementById(id), rain=$('rain'), party=$('party');let soundMuted=false;const sound=$('sound'),effect=$('effect');sound.volume=.5;effect.volume=.7;function syncSound(){if(!active||soundMuted){sound.pause();effect.pause();effect.currentTime=0;$('mute').textContent='音声再生';return;}sound.play().then(()=>{$('mute').textContent='音声停止';}).catch(()=>{$('mute').textContent='音声を有効にする';});}let test=new URLSearchParams(location.search).get('test')==='1',active=false,boostTimer;const fmt=new Intl.DateTimeFormat('ja-JP',{timeZone:'Asia/Tokyo',weekday:'long'});function cans(n){for(let i=0;i<n;i++){const e=document.createElement('img');e.src='can.png';e.alt='';e.className='can';e.style.cssText=`--x:${Math.random()*100}%;--w:${35+Math.random()*45}px;--t:${3+Math.random()*6}s;--delay:${-Math.random()*9}s`;rain.append(e)}}function reset(){clearTimeout(boostTimer);party.classList.remove('boost');$('message').textContent='STATUS: FRIDAY';$('confetti').replaceChildren();rain.replaceChildren();if(active)cans(45); $("oiia").playbackRate=1;}function tick(){const now=new Date(),j=new Date(now.getTime()+9*3600000),d=j.getUTCDay(),isFriday=d===5||test;if(isFriday!==active){active=isFriday;party.hidden=!active;$('standby').hidden=active;reset(); if(active){$("oiia").play().catch(()=>{});}else{$("oiia").pause();sound.currentTime=0;effect.pause();effect.currentTime=0;}syncSound();}$('test').hidden=false;$('test').textContent=test?'テスト終了':'金曜日モードを試す';const days=(5-d+7)%7||7;const next=Date.UTC(j.getUTCFullYear(),j.getUTCMonth(),j.getUTCDate()+days)-9*3600000;const s=Math.max(0,Math.ceil((next-now)/1000));$('count').textContent=[Math.floor(s/86400)+'日',...[Math.floor(s/3600)%24,Math.floor(s/60)%60,s%60].map(v=>String(v).padStart(2,'0'))].join(' ').replace(/(\d\d) (\d\d) (\d\d)$/,'$1:$2:$3');$('day').textContent='現在は'+fmt.format(now)+'です。';$('bar').style.width=Math.max(0,100*(1-s/604800))+'%'}$('boom').onclick=()=>{reset();party.classList.add('boost');cans(180);$('oiia').playbackRate=3;syncSound();if(!soundMuted){effect.currentTime=0;effect.play().catch(()=>{});}$('message').textContent='致命的な金曜日が発生しました。';for(let i=0;i<120;i++){const e=document.createElement('i');e.className='conf';e.style.cssText=`--dx:${(Math.random()-.5)*innerWidth*2}px;--dy:${(Math.random()-.5)*innerHeight*2}px;--color:hsl(${Math.random()*360},90%,65%)`; $('confetti').append(e)}boostTimer=setTimeout(reset,5000)};$('test').onclick=()=>{test=!test;tick();syncSound()};const video=$('oiia'), canvas=$('tiles'), ctx=canvas.getContext('2d'); let paused=matchMedia('(prefers-reduced-motion: reduce)').matches; function pauseMode(){party.classList.toggle('paused',paused); $('motion').textContent=paused?'演出再開':'演出停止'; if(paused){video.pause()}else if(active)video.play().catch(()=>{});} $('motion').onclick=()=>{paused=!paused;pauseMode()};$('mute').onclick=()=>{soundMuted=!sound.paused;syncSound()};document.addEventListener('click',e=>{if(active&&!soundMuted&&sound.paused&&e.target!==$('mute'))syncSound()});function draw(){requestAnimationFrame(draw);if(!active||paused||video.readyState<2)return;const w=innerWidth,h=innerHeight;if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h}ctx.clearRect(0,0,w,h);const size=Math.max(100,Math.min(170,w/5));for(let y=0;y<h+size;y+=size*.85){for(let x=0;x<w+size;x+=size){ctx.drawImage(video,x,y,size,size)}}}tick();pauseMode();draw();setInterval(tick,250);
</script></body></html>
